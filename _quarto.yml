project:
  type: website
  output-dir: ./docs

website:
  title: "Osmandi's blog"
  site-url: https://osmandi.com
  description: "Blog de tecnología y otros cuentos"
  favicon: ./profile.jpg
  navbar:
    right:
      - about.qmd
      - icon: github
        href: https://github.com/osmandi
      - icon: linkedin
        href: https://linkedin.com/in/osmandi
      - icon: rss
        href: index.xml
  draft-mode: unlinked
format:
  html:
    toc: true
    code-fold: false
    number-sections: true
    toc-title: Contents
    theme:
      light: flatly
      dark: darkly
    css: styles.css

